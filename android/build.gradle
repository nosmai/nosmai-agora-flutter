group 'io.agora.agora_rtc_ng'
version '1.0-SNAPSHOT'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs "${project.projectDir}/libs", "${rootProject.projectDir}/app/libs"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Task to copy nosmai AAR to consuming app
task copyNosmaiAar(type: Copy) {
    from 'libs/nosmai-release.aar'
    into "${rootProject.projectDir}/app/libs/"
    doFirst {
        file("${rootProject.projectDir}/app/libs/").mkdirs()
    }
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'io.agora.agora_rtc_ng'
    }
    compileSdkVersion safeExtGet('compileSdkVersion', 31)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)

        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    sourceSets {
        if (isDev(project)) {
           main.jniLibs.srcDirs += 'libs'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

// Ensure the AAR is copied before compilation
afterEvaluate {
    preBuild.dependsOn copyNosmaiAar
}

dependencies {
  // nosmai dependency - automatically copied to consuming app
  api(name: 'nosmai-release', ext: 'aar')
  
  if (isDev(project)) {
    api fileTree(dir: "libs", include: ["*.jar"])
  } else {
    // iris dependencies start
    api 'io.agora.rtc:iris-rtc:4.5.2.143-build.1'
    // iris dependencies end

    // native dependencies start
    api 'io.agora.rtc:agora-special-full:4.5.2.143'
    api 'io.agora.rtc:full-screen-sharing:4.5.2.143'
    // native dependencies end
  }
  
  // Required for Kotlin support
  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
}

static boolean isDev(Project project) {
  def devFile = project.file('.plugin_dev')
  return devFile.exists()
}